<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remove Background</title>
  <link rel="icon" href="data:,">
  <!-- Enables multi-threaded CPU inference on hosts that can't set COOP/COEP headers (GitHub Pages). -->
  <script src="coi-serviceworker.min.js"></script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0 auto; padding: 16px; max-width: 1200px; }
    h1 { font-size: 1.4rem; margin: 0 0 12px; }
    #drop {
      display: block; border: 2px dashed #888; border-radius: 8px; padding: 32px 16px;
      text-align: center; cursor: pointer;
    }
    body.dragging #drop { border-color: #2a7fff; background: #2a7fff22; }
    #toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    #engine { opacity: 0.75; font-size: 0.9rem; }
    .item { border-top: 1px solid #8884; padding: 12px 0; }
    .item header { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
    .item .name { font-weight: 600; overflow-wrap: anywhere; }
    .item .status { opacity: 0.75; font-size: 0.9rem; }
    .item .status.error { color: #e53935; opacity: 1; }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pair img { width: 100%; max-height: 420px; object-fit: contain; display: block; }
    .result {
      background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 20px 20px;
      min-height: 80px;
    }
    @media (max-width: 600px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Remove Background</h1>
  <label id="drop">
    <strong>Drop images here, click to choose, or paste (Ctrl/Cmd+V)</strong><br>
    <small>Runs entirely in your browser. Output: lossless PNG, same resolution, original pixels and colour profile.</small>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </label>
  <div id="toolbar">
    <button id="download-all" disabled>Download all</button>
    <button id="clear">Clear</button>
    <span id="engine"></span>
  </div>
  <main id="list"></main>
  <script type="module" src="app.js"></script>
</body>
</html>
